name: Install SSH Key

# Uso pontual, para recuperacao de acesso administrativo.
#
# Reaproveita o acesso SSH que os workflows de deploy ja possuem para autorizar
# uma chave publica adicional no servidor. Nao altera a aplicacao, nao dispara
# deploy e nao remove chaves existentes.
#
# Remover este workflow apos o uso.

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: 'Chave publica a autorizar (linha completa do arquivo .pub)'
        required: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Append public key to authorized_keys
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            KEY="${{ github.event.inputs.public_key }}"
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
            if grep -qF "$KEY" ~/.ssh/authorized_keys; then
              echo "Chave ja presente, nada a fazer."
            else
              echo "$KEY" >> ~/.ssh/authorized_keys
              echo "Chave instalada."
            fi
            echo "--- chaves autorizadas no servidor ---"
            ssh-keygen -l -f ~/.ssh/authorized_keys
